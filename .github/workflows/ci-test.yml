name: CI Test

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install
    - name: Install OPA
      run: |
        curl -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
        chmod +x /usr/local/bin/opa
        opa version
    - name: Run authz policy tests
      run: npm run authz:policy:test
    - name: Build authz policy artifact
      run: npm run authz:policy:build
    - name: Check migration prefixes
      run: npm run db:migrations:check-prefix
    - name: Guard direct protected fetch regression
      run: npm run qa:check-direct-protected-fetch
    - name: Run tests
      run: npm run ci-test
