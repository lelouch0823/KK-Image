# =============================================================================
# kk-life Wrangler 配置文件
# 参考: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
# SOTA: 遵循 Cloudflare 官方最佳实践
# =============================================================================

name = "kk-life"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./dist"

# SOTA: nodejs_compat_v2 是最新的 Node.js 兼容模式
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# Smart Placement - 自动优化 Functions 位置以减少 D1/R2 访问延迟
# =============================================================================
[placement]
mode = "smart"

# =============================================================================
# 环境变量配置 (顶层 = 开发默认值)
# SOTA: 敏感凭据使用 .dev.vars 文件或 Dashboard 设置，不在此定义
# =============================================================================
[vars]

# 环境标识：development / production
ENVIRONMENT = "development"

# 存储配置
STORAGE_MODE = "single"
# 主存储提供者：telegram, r2, s3
# - telegram: 使用 Telegram Bot API（需配置 TG_Bot_Token 和 TG_Chat_ID）
# - r2: 使用 Cloudflare R2（需配置 R2 桶绑定）
# - s3: 使用 S3 兼容服务（需配置 S3_* 变量）
STORAGE_PROVIDER = "r2"
STORAGE_PRIMARY = "r2"
S3_REGION = "auto"
STORAGE_MIRRORS = ""
STORAGE_MIRROR_ASYNC = "true"
STORAGE_FALLBACK_ENABLED = "true"
STORAGE_FALLBACK_CHAIN = "r2,s3,telegram"
STORAGE_FALLBACK_TIMEOUT = "3000"

# -----------------------------------------------------------------------------
# 🔐 管理员认证（生产环境通过 Dashboard 设置）
# -----------------------------------------------------------------------------
BASIC_USER = "admin"
BASIC_PASS = "123"

# JWT 密钥（生产环境必须通过 Dashboard 设置安全随机字符串）
JWT_SECRET = "kk-image-jwt-secret-change-in-production"

# -----------------------------------------------------------------------------
# 🛡️ 功能开关（可选）
# -----------------------------------------------------------------------------

# 白名单模式：仅允许白名单中的图片显示
WhiteList_Mode = "false"

# 禁用遥测
disable_telemetry = "false"

# AI 配置 (非敏感项)
AI_API_URL = "https://api-inference.modelscope.cn/v1/"
AI_MODELS = "deepseek-ai/DeepSeek-V3.2,Qwen/Qwen3-Coder-480B-A35B-Instruct,Qwen/QwQ-32B"
AI_MODEL_SWITCH_THRESHOLD = "5"

# =============================================================================
# 生产环境配置
# ⚠️ 敏感凭据必须通过以下方式设置：
#   1. Cloudflare Dashboard -> Settings -> Environment Variables
#   2. wrangler pages secret put <SECRET_NAME>
#
# 需通过 Dashboard 设置的敏感变量：
#   - BASIC_PASS (管理员密码)
#   - JWT_SECRET (JWT 签名密钥)
#   - TG_Bot_Token, TG_Chat_ID (Telegram 存储)
#   - S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (S3)
#   - AI_API_KEY (AI 助手)
#   - ModerateContentApiKey (内容审查)
#   - SENTRY_DSN (错误监控)
#   - TURNSTILE_SECRET_KEY (Turnstile 验证)
#   - WECHAT_APPID, WECHAT_SECRET (微信登录)
# =============================================================================
[env.production.vars]
ENVIRONMENT = "production"
COMPRESS_STATIC_ASSETS = "true"
STORAGE_MODE = "single"
STORAGE_PROVIDER = "r2"
STORAGE_PRIMARY = "r2"

# 非敏感默认值
BASIC_USER = "admin"
S3_REGION = "auto"
STORAGE_MIRRORS = ""
STORAGE_MIRROR_ASYNC = "true"
STORAGE_FALLBACK_ENABLED = "true"
STORAGE_FALLBACK_CHAIN = "r2,s3,telegram"
STORAGE_FALLBACK_TIMEOUT = "3000"
WhiteList_Mode = "false"
disable_telemetry = "false"

# AI 配置
AI_API_URL = "https://integrate.api.nvidia.com/v1"
AI_MODELS = "minimaxai/minimax-m2.1"
AI_MODEL_SWITCH_THRESHOLD = "5"

# Turnstile 站点 Key (可公开)
TURNSTILE_SITE_KEY = "0x4AAAAAACJfZho-HoWMjX2s"

# 生产环境 KV 命名空间绑定
[[env.production.kv_namespaces]]
binding = "img_url"
id = "7bedbd0e77b64e548b280114c38a5541"

[[env.production.kv_namespaces]]
binding = "KV"
id = "bd08207a24304cdda4a2989d693fa05e"

[[env.production.kv_namespaces]]
binding = "AI_KV"
id = "bd08207a24304cdda4a2989d693fa05e"

# 生产环境 R2 存储桶绑定
[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "kk-life-storage"

[[env.production.r2_buckets]]
binding = "R2_BACKUP_BUCKET"
bucket_name = "kk-life-backup"

# 生产环境 D1 数据库绑定
[[env.production.d1_databases]]
binding = "DB"
database_name = "kk-life-db"
database_id = "98401861-5d57-4cb8-b092-ba707f8257a3"

# =============================================================================
# 预览环境配置 (用于 PR 预览和集成测试)
# =============================================================================
[env.preview.vars]
COMPRESS_STATIC_ASSETS = "false"
STORAGE_MODE = "single"
STORAGE_PROVIDER = "r2"
STORAGE_PRIMARY = "r2"
S3_REGION = "auto"
STORAGE_MIRRORS = ""
STORAGE_MIRROR_ASYNC = "true"
STORAGE_FALLBACK_ENABLED = "true"
STORAGE_FALLBACK_CHAIN = "r2,s3,telegram"
STORAGE_FALLBACK_TIMEOUT = "3000"
WhiteList_Mode = "false"
disable_telemetry = "false"

# AI 配置 (预览环境)
AI_API_URL = "https://api.openai.com/v1"
AI_MODELS = "gpt-4o"
AI_MODEL_SWITCH_THRESHOLD = "5"

# SOTA: 预览环境敏感变量应通过 .dev.vars.preview 或 Dashboard 设置
# 以下为测试占位符，实际值不应提交到代码库
BASIC_USER = "admin"
BASIC_PASS = "preview123"
JWT_SECRET = "kk-image-jwt-secret-preview"
TG_Bot_Token = ""
TG_Chat_ID = ""
S3_ENDPOINT = ""
S3_BUCKET = ""
S3_ACCESS_KEY_ID = ""
S3_SECRET_ACCESS_KEY = ""
ModerateContentApiKey = ""
SENTRY_DSN = ""
AI_API_KEY = ""

# 预览环境 D1 数据库绑定
[[env.preview.d1_databases]]
binding = "DB"
database_name = "kk-life-db-test"
database_id = "969b18c0-8c41-474b-8730-5141285fd259"
migrations_dir = "migrations"

# 预览环境 KV 命名空间绑定
[[env.preview.kv_namespaces]]
binding = "KV"
id = "bf021825476e44d890655a419424d28a"

[[env.preview.kv_namespaces]]
binding = "AI_KV"
id = "bf021825476e44d890655a419424d28a"

# 预览环境 R2 存储桶绑定
[[env.preview.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "kk-life-storage-test"

[[env.preview.r2_buckets]]
binding = "R2_BACKUP_BUCKET"
bucket_name = "kk-life-backup-test"

# =============================================================================
# 顶层绑定 (本地开发默认使用)
# SOTA: Bindings 不可继承，每个环境需单独定义
# =============================================================================

# R2 存储桶 (本地开发)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "kk-life-storage"

[[r2_buckets]]
binding = "R2_BACKUP_BUCKET"
bucket_name = "kk-life-backup"

# D1 数据库 (本地开发)
[[d1_databases]]
binding = "DB"
database_name = "kk-life-db"
database_id = "98401861-5d57-4cb8-b092-ba707f8257a3"
migrations_dir = "migrations"

# KV 命名空间 (本地开发 - wrangler 自动创建本地存储)
[[kv_namespaces]]
binding = "KV"
id = "bd08207a24304cdda4a2989d693fa05e"

[[kv_namespaces]]
binding = "AI_KV"
id = "bd08207a24304cdda4a2989d693fa05e"
